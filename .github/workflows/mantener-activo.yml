# Los proyectos gratis de Supabase se pausan tras 7 días sin actividad. Esta tarea llama cada 2 días a la función `ping`,
# que hace una consulta mínima a la base. Solo corre desde la rama principal (regla de GitHub para tareas programadas).
# Si el repositorio es público y pasa 60 días sin actividad, GitHub desactiva las tareas programadas: hay que reactivarla en la pestaña Actions.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Llamar a la función ping
        run: |
          curl --fail --silent --show-error --retry 3 --retry-delay 20 \
            "https://tiiyjggvjxnvfbmpwrlv.supabase.co/functions/v1/ping"
